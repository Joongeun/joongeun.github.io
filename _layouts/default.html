<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
  <!-- Subtle CRT scanline overlay (purely decorative, non-interactive) -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- Scroll progress bar -->
  <div class="progress-container" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  {% include navbar.html %}

  <!-- Falling autumn leaves drifting through the side margins (New England fall) -->
  <canvas class="leaves" id="leaves" aria-hidden="true"></canvas>

  <main class="container">
    {{ content }}
  </main>

  {% include garden.html %}
  {% include tamagotchi.html %}

  <script>
    window.__ROLES__ = [{% for r in site.data.profile.roles %}{{ r | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}];
  </script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/garden.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/tamagotchi.js' | relative_url }}" defer></script>
</body>
</html>
